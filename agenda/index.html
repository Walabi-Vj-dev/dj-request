<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Agenda Walabi</title>
<style>
/* Layout: barra de controles arriba, resumen de cobros, y la vista elegida (mes / agenda / año). Cada "estilo" redefine los tokens. */
:root{
  --bg:#05080d; --panel:#0b1119; --line:#16303b; --fg:#d7f6ff; --muted:#6d93a1; --accent:#22e4ff; --accent-ink:#001318;
  --ok:#3dff9e; --due:#ff5a7a; --today:#22e4ff;
  --display:"Chakra Petch", "Segoe UI", sans-serif; --body:"IBM Plex Mono", ui-monospace, monospace; --num:"IBM Plex Mono", ui-monospace, monospace;
  --radius:2px; --chip-radius:2px;
  color-scheme:dark;
}
:root[data-skin="claro"]{
  --bg:#f5f6f8; --panel:#ffffff; --line:#dfe3ea; --fg:#1b2230; --muted:#6b7487; --accent:#2f5bea; --accent-ink:#ffffff;
  --ok:#14945a; --due:#d23b4f; --today:#2f5bea;
  --display:"Bricolage Grotesque", "Segoe UI", sans-serif; --body:"Bricolage Grotesque", "Segoe UI", sans-serif; --num:"IBM Plex Mono", ui-monospace, monospace;
  --radius:12px; --chip-radius:6px; color-scheme:light;
}
:root[data-skin="papel"]{
  --bg:#efe9dc; --panel:#fbf8f1; --line:#d8cdb8; --fg:#2c2418; --muted:#857760; --accent:#b4541f; --accent-ink:#fff8ef;
  --ok:#3f7d3a; --due:#b3261e; --today:#b4541f;
  --display:"Fraunces", Georgia, serif; --body:"Bricolage Grotesque", "Segoe UI", sans-serif; --num:"IBM Plex Mono", ui-monospace, monospace;
  --radius:4px; --chip-radius:3px; color-scheme:light;
}
:root[data-skin="noche"]{
  --bg:#14111f; --panel:#1d1930; --line:#2f2948; --fg:#efeaff; --muted:#948bb5; --accent:#ff7ad9; --accent-ink:#22061a;
  --ok:#6ff0c4; --due:#ffb15c; --today:#ff7ad9;
  --display:"Bricolage Grotesque", "Segoe UI", sans-serif; --body:"Bricolage Grotesque", "Segoe UI", sans-serif; --num:"IBM Plex Mono", ui-monospace, monospace;
  --radius:16px; --chip-radius:999px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
:root:not([data-skin]) body, :root[data-skin="hud"] body{
  background-image:linear-gradient(rgba(34,228,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,228,255,.05) 1px,transparent 1px);
  background-size:28px 28px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand h1{font-family:var(--display);font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:.01em;text-wrap:balance}
:root:not([data-skin]) .brand h1, :root[data-skin="hud"] .brand h1{text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 18px rgba(34,228,255,.45)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:4px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:8px 14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--due);border-color:var(--due);background:transparent}

.navbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.navbar h2{font-family:var(--display);margin:0;font-size:clamp(20px,3.4vw,26px);min-width:9ch;text-transform:capitalize}
.navbar .spacer{flex:1}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.stat.ok .v{color:var(--ok)} .stat.due .v{color:var(--due)}

/* Mes */
.month{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:transparent;text-align:left;border-top:0;border-left:0;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.35}
.day:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.day .n{font-family:var(--num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.today .n{color:var(--accent-ink);background:var(--today);border-radius:var(--chip-radius);padding:0 6px;align-self:flex-start;font-weight:600}
.chip{display:flex;flex-direction:column;gap:1px;border:0;border-radius:var(--chip-radius);padding:4px 7px;font-size:11.5px;line-height:1.25;text-align:left;color:#0b0b0b;background:var(--c);min-width:0;width:100%}
.chip .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .m{font-family:var(--num);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.chip.light-ink{color:#fff}
:root:not([data-skin]) .chip, :root[data-skin="hud"] .chip{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--fg);border-left:3px solid var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 30%,transparent)}
:root[data-skin="papel"] .chip{background:color-mix(in srgb,var(--c) 30%,var(--panel));color:var(--fg);border:1px solid color-mix(in srgb,var(--c) 70%,#000)}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 5px;border-radius:3px;background:rgba(0,0,0,.18)}
.badge.pago{background:var(--ok);color:#06140c}
.badge.debe{background:var(--due);color:#fff}

/* Agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;border-left:5px solid var(--c)}
.arow .d{font-family:var(--display);text-align:center;line-height:1}
.arow .d b{display:block;font-size:24px}
.arow .d span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.arow .name{font-weight:600;overflow-wrap:anywhere}
.arow .note{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.arow .amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.toggle{border:1px solid var(--line);border-radius:var(--chip-radius);padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:transparent}
.toggle.pago{background:var(--ok);color:#06140c;border-color:var(--ok)}
.toggle.debe{background:var(--due);color:#fff;border-color:var(--due)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

/* Año */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.mini h3{margin:0;font-family:var(--display);font-size:15px;text-transform:capitalize;display:flex;justify-content:space-between;gap:8px}
.mini h3 small{font-family:var(--num);font-size:11px;color:var(--muted);font-weight:400}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid span{aspect-ratio:1;display:grid;place-items:center;font-size:10px;font-family:var(--num);color:var(--muted);border-radius:var(--chip-radius);max-width:100%}
.mgrid span.has{background:var(--c);color:#111;font-weight:700}
.mgrid span.has.debe{outline:2px solid var(--due);outline-offset:-2px}
.mini .tot{font-family:var(--num);font-size:11.5px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 10px}
.mini .tot .ok{color:var(--ok)} .mini .tot .due{color:var(--due)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-family:var(--display);font-size:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field input[type=text],.field input[type=date],.field input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:var(--chip-radius);padding:9px 10px;width:100%}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.swatches input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;padding:0;background:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .left{margin-right:auto}
.confirm{font-size:12.5px;color:var(--due);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:11.5px;color:var(--muted)}

@media (max-width:640px){
  .day{min-height:64px;padding:3px}
  .chip{padding:2px 4px;font-size:10px}
  .chip .m{display:none}
  .arow{grid-template-columns:50px minmax(0,1fr);}
  .arow .amt,.arow .toggle{grid-column:2}
  .arow .amt{text-align:left}
  .arow .toggle{justify-self:start}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.btn,.seg button,.toggle{transition:transform .12s ease,background-color .15s ease}
  .chip:hover{transform:translateY(-1px)}
}
</style>
</head><body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Agenda de eventos</h1>
      <p>Fechas, cobros y lo que falta cobrar · Walabi VJ</p>
    </div>
    <div class="controls">
      <div class="ctl"><span class="lbl">Estilo</span>
        <div class="seg" id="skinSeg">
          <button data-skin="hud">HUD</button>
          <button data-skin="claro">Claro</button>
          <button data-skin="papel">Papel</button>
          <button data-skin="noche">Noche</button>
        </div>
      </div>
      <div class="ctl"><span class="lbl">Vista</span>
        <div class="seg" id="viewSeg">
          <button data-view="mes">Mes</button>
          <button data-view="agenda">Agenda</button>
          <button data-view="anio">Año</button>
        </div>
      </div>
    </div>
  </header>

  <div class="navbar">
    <button class="btn" id="prev" aria-label="Anterior">◀</button>
    <h2 id="period"></h2>
    <button class="btn" id="next" aria-label="Siguiente">▶</button>
    <button class="btn" id="todayBtn">Hoy</button>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="btn" id="expBtn">Guardar copia</button>
    <label class="btn" for="impFile" style="cursor:pointer">Cargar copia</label>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn primary" id="addBtn">+ Nuevo evento</button>
  </div>

  <section class="summary" id="summary"></section>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="modal" id="form" autocomplete="off">
    <h3 id="formTitle">Nuevo evento</h3>
    <div class="field"><label class="lbl" for="f-name">Nombre del evento</label>
      <input type="text" id="f-name" required placeholder="Ej: Casamiento Salón Las Acacias"></div>
    <div class="field"><label class="lbl" for="f-date">Fecha</label>
      <input type="date" id="f-date" required></div>
    <div class="row2">
      <div class="field"><label class="lbl" for="f-amount">Monto</label>
        <input type="number" id="f-amount" min="0" step="any" inputmode="decimal" placeholder="0"></div>
      <div class="field"><span class="lbl">Moneda</span>
        <div class="seg" id="curSeg"><button type="button" data-cur="ARS">$ Pesos</button><button type="button" data-cur="USD">US$ Dólares</button></div></div>
    </div>
    <div class="field"><span class="lbl">Estado del cobro</span>
      <div class="seg" id="stSeg"><button type="button" data-st="debe">✗ Debe</button><button type="button" data-st="pago">✓ Pagó</button></div></div>
    <div class="field"><span class="lbl">Color del bloque</span>
      <div class="swatches" id="swatches"></div></div>
    <div class="field"><label class="lbl" for="f-note">Nota (opcional)</label>
      <input type="text" id="f-note" placeholder="Seña, lugar, contacto…"></div>
    <div class="confirm" id="confirmDel" hidden>¿Borrar este evento? <button type="button" class="btn danger" id="reallyDel">Sí, borrar</button><button type="button" class="btn" id="cancelDel">No</button></div>
    <div class="actions">
      <button type="button" class="btn danger left" id="delBtn" hidden>Borrar</button>
      <button type="button" class="btn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</div>

<script>
(function(){
  const COLORS=["#22e4ff","#3dff9e","#ffd23f","#ff7a45","#ff4f8b","#b072ff","#4f7bff","#e8e8e8"];
  const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const DOW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const $=s=>document.querySelector(s);
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  let events=[]; let db=null; let col=null;
  let skin=store.get("cal-skin")||"hud";
  let view=store.get("cal-view")||"mes";
  const now=new Date();
  let cur={y:now.getFullYear(),m:now.getMonth()};
  let editing=null, fCur="ARS", fSt="debe", fColor=COLORS[0];

  const pad=n=>String(n).padStart(2,"0");
  const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
  const todayIso=iso(now.getFullYear(),now.getMonth(),now.getDate());
  const fmt=(n,c)=>{const v=Number(n)||0;const s=new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(v);return (c==="USD"?"US$ ":"$ ")+s};
  function lum(hex){const h=hex.replace("#","");if(h.length<6)return 1;const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)/255}
  function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

  function applySkin(){document.documentElement.setAttribute("data-skin",skin);
    document.querySelectorAll("#skinSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.skin===skin));}
  function setView(v){view=v;store.set("cal-view",v);
    document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));render();}

  function inPeriod(e){const [y,m]=e.date.split("-").map(Number);return view==="anio"?y===cur.y:(y===cur.y&&m-1===cur.m)}
  function totals(list){const t={ARS:{pago:0,debe:0},USD:{pago:0,debe:0}};list.forEach(e=>{const c=e.currency==="USD"?"USD":"ARS";t[c][e.status==="pago"?"pago":"debe"]+=Number(e.amount)||0});return t}

  function renderSummary(){
    const list=events.filter(inPeriod); const t=totals(list);
    const scope=view==="anio"?`en ${cur.y}`:"este mes";
    const cards=[`<div class="stat"><span class="lbl">Eventos ${scope}</span><span class="v">${list.length}</span></div>`];
    ["ARS","USD"].forEach(c=>{
      if(c==="USD"&&!t.USD.pago&&!t.USD.debe&&list.length)return;
      cards.push(`<div class="stat ok"><span class="lbl">Cobrado ${c==="USD"?"dólares":"pesos"}</span><span class="v">${fmt(t[c].pago,c)}</span></div>`);
      cards.push(`<div class="stat due"><span class="lbl">Falta cobrar ${c==="USD"?"dólares":"pesos"}</span><span class="v">${fmt(t[c].debe,c)}</span></div>`);
    });
    $("#summary").innerHTML=cards.join("");
  }

  function chip(e){const light=lum(e.color||"#fff")<.5;
    return `<button type="button" class="chip${light?" light-ink":""}" style="--c:${esc(e.color)}" data-id="${esc(e.id)}" title="${esc(e.name)} · ${fmt(e.amount,e.currency)} · ${e.status==="pago"?"Pagó":"Debe"}">
      <span class="t">${esc(e.name)}</span>
      <span class="m">${fmt(e.amount,e.currency)} <span class="badge ${e.status==="pago"?"pago":"debe"}">${e.status==="pago"?"✓ Pagó":"Debe"}</span></span></button>`}

  function renderMonth(){
    const first=new Date(cur.y,cur.m,1); const start=(first.getDay()+6)%7;
    const days=new Date(cur.y,cur.m+1,0).getDate(); const cells=Math.ceil((start+days)/7)*7;
    let h=`<div class="month"><div class="dow">${DOW.map(d=>`<div>${d}</div>`).join("")}</div><div class="grid">`;
    for(let i=0;i<cells;i++){
      const d=new Date(cur.y,cur.m,i-start+1); const key=iso(d.getFullYear(),d.getMonth(),d.getDate());
      const out=d.getMonth()!==cur.m; const evs=events.filter(e=>e.date===key);
      h+=`<div class="day${out?" out":""}${key===todayIso?" today":""}" data-date="${key}" role="button" tabindex="0" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}"><span class="n">${d.getDate()}</span>${evs.map(chip).join("")}</div>`;
    }
    return h+"</div></div>";
  }

  function renderAgenda(){
    const list=events.filter(inPeriod).sort((a,b)=>a.date.localeCompare(b.date));
    if(!list.length)return `<div class="empty">No hay eventos en ${MESES[cur.m]}. Tocá <b>+ Nuevo evento</b> para cargar el primero.</div>`;
    return `<div class="agenda">${list.map(e=>{const d=new Date(e.date+"T12:00");
      return `<div class="arow" style="--c:${esc(e.color)}">
        <div class="d"><b>${d.getDate()}</b><span>${DOW[(d.getDay()+6)%7]}</span></div>
        <div style="min-width:0"><div class="name"><a href="#" data-id="${esc(e.id)}" style="color:inherit;text-decoration:none">${esc(e.name)}</a></div>${e.note?`<div class="note">${esc(e.note)}</div>`:""}</div>
        <div class="amt">${fmt(e.amount,e.currency)}</div>
        <button type="button" class="toggle ${e.status==="pago"?"pago":"debe"}" data-toggle="${esc(e.id)}" aria-label="Cambiar estado">${e.status==="pago"?"✓ Pagó":"✗ Debe"}</button>
      </div>`}).join("")}</div>`;
  }

  function renderYear(){
    let h=`<div class="year">`;
    for(let m=0;m<12;m++){
      const evs=events.filter(e=>{const [y,mm]=e.date.split("-").map(Number);return y===cur.y&&mm-1===m});
      const t=totals(evs); const start=(new Date(cur.y,m,1).getDay()+6)%7; const days=new Date(cur.y,m+1,0).getDate();
      let g=""; for(let i=0;i<start;i++)g+="<span></span>";
      for(let d=1;d<=days;d++){const key=iso(cur.y,m,d);const e=evs.filter(x=>x.date===key);
        if(e.length){const debe=e.some(x=>x.status!=="pago");g+=`<span class="has${debe?" debe":""}" style="--c:${esc(e[0].color)}" title="${esc(e.map(x=>x.name).join(", "))}">${d}</span>`}
        else g+=`<span>${d}</span>`}
      const tot=[];["ARS","USD"].forEach(c=>{if(t[c].pago)tot.push(`<span class="ok">✓ ${fmt(t[c].pago,c)}</span>`);if(t[c].debe)tot.push(`<span class="due">✗ ${fmt(t[c].debe,c)}</span>`)});
      h+=`<button type="button" class="mini" data-month="${m}"><h3>${MESES[m]} <small>${evs.length} ev.</small></h3><div class="mgrid">${g}</div><div class="tot">${tot.join("")||'<span style="color:var(--muted)">Sin eventos</span>'}</div></button>`;
    }
    return h+"</div>";
  }

  function render(){
    $("#period").textContent=view==="anio"?String(cur.y):`${MESES[cur.m]} ${cur.y}`;
    renderSummary();
    $("#view").innerHTML=view==="mes"?renderMonth():view==="agenda"?renderAgenda():renderYear();
  }

  // ---- Modal ----
  function setSeg(sel,attr,val){document.querySelectorAll(sel+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset[attr]===val))}
  function drawSwatches(){
    const isCustom=!COLORS.includes(fColor);
    $("#swatches").innerHTML=COLORS.map(c=>`<button type="button" class="sw" style="--c:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c===fColor}"></button>`).join("")+
      `<input type="color" id="f-color" value="${isCustom?fColor:"#ffffff"}" title="Otro color" aria-label="Elegir otro color">`;
    $("#f-color").addEventListener("input",ev=>{fColor=ev.target.value;document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed","false"))});
  }
  function openForm(e,date){
    editing=e||null;
    $("#formTitle").textContent=e?"Editar evento":"Nuevo evento";
    $("#f-name").value=e?e.name:""; $("#f-date").value=e?e.date:(date||todayIso);
    $("#f-amount").value=e&&e.amount?e.amount:""; $("#f-note").value=e?(e.note||""):"";
    fCur=e?e.currency:"ARS"; fSt=e?e.status:"debe"; fColor=e?e.color:COLORS[events.length%COLORS.length];
    setSeg("#curSeg","cur",fCur); setSeg("#stSeg","st",fSt); drawSwatches();
    $("#delBtn").hidden=!e; $("#confirmDel").hidden=true;
    $("#scrim").hidden=false; setTimeout(()=>$("#f-name").focus(),30);
  }
  function closeForm(){$("#scrim").hidden=true;editing=null}

  async function save(data){
    if(col){
      try{ if(data.id){await col.doc(data.id).set(data)} else {const ref=col.doc(); data.id=ref.id; await ref.set(data)} }
      catch(err){ $("#status").textContent=err&&err.code==="quota_exceeded"?"No hay más lugar para eventos: borrá algunos viejos.":"No se pudo guardar. Probá de nuevo."; }
    } else {
      if(!data.id)data.id="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const i=events.findIndex(x=>x.id===data.id); if(i>=0)events[i]=data; else events.push(data);
      store.set("cal-events",JSON.stringify(events)); render();
    }
  }
  async function remove(id){
    if(col){try{await col.doc(id).delete()}catch(e){$("#status").textContent="No se pudo borrar."}}
    else{events=events.filter(x=>x.id!==id);store.set("cal-events",JSON.stringify(events));render()}
  }

  // ---- Eventos UI ----
  $("#skinSeg").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;skin=b.dataset.skin;store.set("cal-skin",skin);applySkin()});
  $("#viewSeg").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b)setView(b.dataset.view)});
  $("#prev").onclick=()=>{if(view==="anio")cur.y--;else{cur.m--;if(cur.m<0){cur.m=11;cur.y--}}render()};
  $("#next").onclick=()=>{if(view==="anio")cur.y++;else{cur.m++;if(cur.m>11){cur.m=0;cur.y++}}render()};
  $("#todayBtn").onclick=()=>{cur={y:now.getFullYear(),m:now.getMonth()};render()};
  $("#addBtn").onclick=()=>openForm(null,view==="mes"&&cur.m!==now.getMonth()?iso(cur.y,cur.m,1):todayIso);

  $("#view").addEventListener("click",ev=>{
    const t=ev.target;
    const tg=t.closest("[data-toggle]"); if(tg){const e=events.find(x=>x.id===tg.dataset.toggle);if(e)save({...e,status:e.status==="pago"?"debe":"pago"});return}
    const c=t.closest("[data-id]"); if(c){ev.preventDefault();const e=events.find(x=>x.id===c.dataset.id);if(e)openForm(e);return}
    const mo=t.closest("[data-month]"); if(mo){cur.m=+mo.dataset.month;setView("mes");return}
    const d=t.closest("[data-date]"); if(d)openForm(null,d.dataset.date);
  });
  $("#view").addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches(".day")){ev.preventDefault();openForm(null,ev.target.dataset.date)}});

  $("#curSeg").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b){fCur=b.dataset.cur;setSeg("#curSeg","cur",fCur)}});
  $("#stSeg").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b){fSt=b.dataset.st;setSeg("#stSeg","st",fSt)}});
  $("#swatches").addEventListener("click",ev=>{const b=ev.target.closest(".sw");if(b){fColor=b.dataset.c;document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===b))}});
  $("#cancelBtn").onclick=closeForm;
  $("#scrim").addEventListener("click",ev=>{if(ev.target.id==="scrim")closeForm()});
  document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("#scrim").hidden)closeForm()});
  $("#delBtn").onclick=()=>{$("#confirmDel").hidden=false};
  $("#cancelDel").onclick=()=>{$("#confirmDel").hidden=true};
  $("#reallyDel").onclick=()=>{if(editing)remove(editing.id);closeForm()};
  $("#form").addEventListener("submit",ev=>{ev.preventDefault();
    const name=$("#f-name").value.trim(); const date=$("#f-date").value; if(!name||!date)return;
    const data={name,date,amount:parseFloat($("#f-amount").value)||0,currency:fCur,status:fSt,color:fColor,note:$("#f-note").value.trim()};
    if(editing)data.id=editing.id;
    save(data); const [y,m]=date.split("-").map(Number); if(view!=="anio"){cur={y,m:m-1}} closeForm();
  });

  // ---- Arranque ----
  applySkin(); setView(view);
  try{const raw=store.get("cal-events");if(raw){events=JSON.parse(raw)||[];render()}}catch(e){}
  $("#status").textContent="Guardado en este dispositivo";
  $("#expBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify({app:"agenda-walabi",version:1,events},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="agenda-walabi-"+todayIso+".json";
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
    $("#status").textContent="Copia guardada en Descargas";
  };
  $("#impFile").addEventListener("change",ev=>{
    const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);const list=Array.isArray(d)?d:d.events;
      if(!Array.isArray(list))throw 0;events=list.filter(x=>x&&x.date&&x.name);store.set("cal-events",JSON.stringify(events));render();
      $("#status").textContent="Copia cargada: "+events.length+" eventos"}catch(e){$("#status").textContent="Ese archivo no es una copia de la agenda"}};
    r.readAsText(f);ev.target.value="";
  });
})();
</script>
<noscript><p style="padding:16px">Esta agenda necesita abrirse en Safari o Chrome.</p></noscript>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body></html>
