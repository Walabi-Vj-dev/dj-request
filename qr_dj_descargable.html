
<style>
  .qr-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 24px;gap:20px}
  .qr-card{background:#0a0a0a;border-radius:20px;padding:28px 28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 0 0 1px rgba(255,255,255,0.08)}
  .qr-title{font-family:sans-serif;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#ff2d9b}
  .qr-sub{font-size:11px;color:rgba(255,255,255,0.3);font-family:sans-serif;letter-spacing:0.06em}
  .dl-btn{padding:12px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff2d9b,#9b1dea);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;letter-spacing:0.06em}
  .dl-btn:hover{opacity:.9}
</style>
<div class="qr-wrap">
  <div class="qr-card">
    <div class="qr-title">🎧 DJ Set</div>
    <canvas id="qr" width="200" height="200" style="border-radius:10px"></canvas>
    <div class="qr-sub">walabi-vj-dev.github.io/dj-request/</div>
  </div>
  <button class="dl-btn" onclick="download()">⬇ Descargar QR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const url = 'https://walabi-vj-dev.github.io/dj-request/';
const tmp = document.createElement('div');
document.body.appendChild(tmp);
new QRCode(tmp, {text:url, width:200, height:200, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H});

setTimeout(()=>{
  const canvas = document.getElementById('qr');
  const ctx = canvas.getContext('2d');
  const src = tmp.querySelector('canvas') || tmp.querySelector('img');
  if(src && src.tagName==='CANVAS'){
    ctx.drawImage(src,0,0,200,200);
  } else if(src){
    src.onload = ()=>ctx.drawImage(src,0,0,200,200);
    if(src.complete) ctx.drawImage(src,0,0,200,200);
  }
  tmp.remove();
}, 600);

function download(){
  const name = window._eventName || 'DJ Set';
  const canvas = document.getElementById('qr');
  const out = document.createElement('canvas');
  out.width = 400; out.height = 480;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0,0,400,480);
  ctx.fillStyle = '#ffffff';
  ctx.roundRect(75,70,250,250,12);
  ctx.fill();
  ctx.drawImage(canvas, 87, 82, 226, 226);
  ctx.fillStyle = '#ff2d9b';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎧 ' + name, 200, 48);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '13px sans-serif';
  ctx.fillText('Pedí tu tema — aparece en pantalla', 200, 360);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '11px sans-serif';
  ctx.fillText('walabi-vj-dev.github.io/dj-request/', 200, 390);
  const a = document.createElement('a');
  a.download = name + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBw0CqhfhOvgslp2n6gBuxOPxq_uA2hZHk",
  authDomain: "pedi-tu-tema-al-dj.firebaseapp.com",
  databaseURL: "https://pedi-tu-tema-al-dj-default-rtdb.firebaseio.com",
  projectId: "pedi-tu-tema-al-dj",
  storageBucket: "pedi-tu-tema-al-dj.firebasestorage.app",
  messagingSenderId: "191645194240",
  appId: "1:191645194240:web:541c2574d3ab80f1c660e5"
};
const db = getDatabase(initializeApp(firebaseConfig));
onValue(ref(db, 'config/eventName'), snap => {
  const val = snap.val();
  if (val) {
    document.querySelector('.qr-title').textContent = '🎧 ' + val;
    window._eventName = val;
  }
});
</script>
